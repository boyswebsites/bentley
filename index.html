<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Home Run Derby Championship</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { background: #1a1a24; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; color: #fff; }
    #game-container { position: relative; width: 800px; height: 600px; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,0.6); }
    canvas { width: 100%; height: 100%; display: block; }
    .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 15, 25, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 1; transition: opacity 0.3s; z-index: 10; }
    .overlay.hidden { opacity: 0; pointer-events: none; }
    h1 { font-size: 3rem; margin-bottom: 10px; color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
    p { font-size: 1.2rem; margin-bottom: 25px; color: #cbd5e1; }
    .btn { padding: 14px 32px; font-size: 1.2rem; font-weight: bold; color: #fff; background: #2563eb; border: none; border-radius: 8px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); }
    .btn:hover { background: #1d4ed8; transform: translateY(-2px); }
    .btn:active { transform: translateY(0); }
    #hud { position: absolute; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; font-size: 1.2rem; font-weight: bold; text-shadow: 2px 2px 4px #000; z-index: 5; }
    .hud-card { background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div class="hud-card">Score: <span id="score-val" style="color:#10b981">0</span></div>
    <div class="hud-card">Home Runs: <span id="hr-val" style="color:#f59e0b">0</span></div>
    <div class="hud-card">Outs: <span id="outs-val" style="color:#ef4444">0 / 10</span></div>
  </div>

  <div id="start-overlay" class="overlay">
    <h1>HOME RUN DERBY</h1>
    <p>Click or press SPACE to swing!</p>
    <button id="start-btn" class="btn">START DERBY</button>
  </div>

  <div id="gameover-overlay" class="overlay hidden">
    <h1>GAME OVER</h1>
    <p id="final-stats">Total HRs: 0 | Total Distance: 0 ft</p>
    <button id="restart-btn" class="btn">PLAY AGAIN</button>
  </div>

  <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.connect(gain);
  gain.connect(audioCtx.destination);

  if (type === 'hit') {
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.15);
  } else if (type === 'hr') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3);
    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
  } else if (type === 'pitch') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(150, audioCtx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.2);
  }
}

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const startOverlay = document.getElementById('start-overlay');
const gameoverOverlay = document.getElementById('gameover-overlay');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const scoreVal = document.getElementById('score-val');
const hrVal = document.getElementById('hr-val');
const outsVal = document.getElementById('outs-val');
const finalStats = document.getElementById('final-stats');

let animId = null;
let gameState = 'START';
let score = 0;
let hrs = 0;
let outs = 0;
let totalDist = 0;

let ball = null;
let particles = [];
let floatingTexts = [];
let isSwinging = false;
let swingProgress = 0;
let pitchTimer = 0;

class Ball {
  constructor() {
    this.x = 400;
    this.y = 280;
    this.z = 100;
    this.vx = (Math.random() - 0.5) * 1.5;
    this.vy = 0;
    this.vz = -2.2 - Math.random() * 0.8;
    this.radius = 4;
    this.hit = false;
    this.distance = 0;
  }

  update() {
    if (!this.hit) {
      this.x += this.vx;
      this.z += this.vz;
      this.radius = Math.max(3, 18 * (1 - this.z / 100));
      this.y = 280 + (100 - this.z) * 1.8;

      if (this.z <= -10 && !this.hit) {
        recordOut("STRIKE / OUT");
        return false;
      }
    } else {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.25;
      this.z += this.vz;
      this.radius = Math.max(3, this.radius * 0.985);

      if (this.y > 620 || this.radius < 2) {
        return false;
      }
    }
    return true;
  }

  draw() {
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(2, this.radius), 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(255,255,255,0.8)';
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.closePath();
    ctx.restore();
  }
}

function triggerSwing() {
  if (gameState !== 'PLAYING' || isSwinging) return;
  initAudio();
  isSwinging = true;
  swingProgress = 0;

  if (ball && !ball.hit && ball.z <= 25 && ball.z >= -10) {
    const timing = ball.z;
    ball.hit = true;
    playSound('hit');

    const quality = 1 - Math.abs(timing) / 20;
    const isHR = quality > 0.45;

    if (isHR) {
      ball.vx = (ball.x - 400) * 0.3 + (Math.random() - 0.5) * 4;
      ball.vy = -12 - Math.random() * 5 - quality * 6;
      ball.vz = 3 + quality * 4;
      ball.distance = Math.floor(380 + quality * 130 + Math.random() * 30);
      
      hrs++;
      score += 1000 + ball.distance * 2;
      totalDist += ball.distance;
      
      addParticles(ball.x, ball.y, '#f59e0b', 25);
      addFloatingText(`${ball.distance} FT - HOME RUN!`, ball.x, ball.y - 20, '#f59e0b');
      playSound('hr');
    } else {
      ball.vx = (Math.random() - 0.5) * 8;
      ball.vy = -4 - Math.random() * 4;
      ball.vz = 1;
      recordOut("FOUL / POP OUT");
    }
    updateHUD();
  }
}

function recordOut(reason) {
  outs++;
  addFloatingText(reason, 400, 350, '#ef4444');
  updateHUD();
  ball = null;
  pitchTimer = 60;

  if (outs >= 10) {
    endGame();
  }
}

function addParticles(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 10,
      vy: (Math.random() - 0.5) * 10,
      life: 1.0,
      color
    });
  }
}

function addFloatingText(text, x, y, color) {
  floatingTexts.push({ text, x, y, alpha: 1.0, color });
}

function spawnPitch() {
  ball = new Ball();
  playSound('pitch');
}

function updateHUD() {
  scoreVal.textContent = score;
  hrVal.textContent = hrs;
  outsVal.textContent = `${outs} / 10`;
}

function drawStadium() {
  let skyGrad = ctx.createLinearGradient(0, 0, 0, 250);
  skyGrad.addColorStop(0, '#0f172a');
  skyGrad.addColorStop(1, '#1e293b');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, 800, 250);

  ctx.fillStyle = '#065f46';
  ctx.fillRect(0, 220, 800, 60);
  ctx.fillStyle = '#047857';
  ctx.fillRect(0, 220, 800, 6);

  let grassGrad = ctx.createLinearGradient(0, 280, 0, 600);
  grassGrad.addColorStop(0, '#15803d');
  grassGrad.addColorStop(1, '#166534');
  ctx.fillStyle = grassGrad;
  ctx.beginPath();
  ctx.moveTo(0, 280);
  ctx.lineTo(800, 280);
  ctx.lineTo(800, 600);
  ctx.lineTo(0, 600);
  ctx.fill();

  ctx.fillStyle = '#9a3412';
  ctx.beginPath();
  ctx.ellipse(400, 500, 260, 100, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#7c2d12';
  ctx.beginPath();
  ctx.ellipse(400, 310, 35, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.moveTo(400, 520);
  ctx.lineTo(415, 532);
  ctx.lineTo(415, 545);
  ctx.lineTo(385, 545);
  ctx.lineTo(385, 532);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = '#cbd5e1';
  ctx.fillRect(396, 282, 8, 22);
  ctx.beginPath();
  ctx.arc(400, 278, 5, 0, Math.PI * 2);
  ctx.fill();
}

function drawBatter() {
  ctx.save();
  ctx.translate(340, 500);

  ctx.fillStyle = '#38bdf8';
  ctx.fillRect(-10, -40, 20, 45);
  ctx.fillStyle = '#f87171';
  ctx.beginPath();
  ctx.arc(0, -50, 9, 0, Math.PI * 2);
  ctx.fill();

  let currentBatAngle = -Math.PI / 4;
  if (isSwinging) {
    currentBatAngle += swingProgress * Math.PI * 1.2;
  }

  ctx.save();
  ctx.translate(5, -25);
  ctx.rotate(currentBatAngle);
  ctx.fillStyle = '#d97706';
  ctx.fillRect(0, -4, 45, 6);
  ctx.restore();

  ctx.restore();
}

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawStadium();

  if (gameState === 'PLAYING') {
    if (!ball) {
      pitchTimer--;
      if (pitchTimer <= 0) {
        spawnPitch();
      }
    } else {
      if (!ball.update()) {
        ball = null;
        pitchTimer = 50;
      } else {
        ball.draw();
      }
    }

    if (isSwinging) {
      swingProgress += 0.12;
      if (swingProgress >= 1) {
        isSwinging = false;
        swingProgress = 0;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life -= 0.03;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.life;
      ctx.fillRect(p.x, p.y, 4, 4);
      ctx.globalAlpha = 1.0;
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      let ft = floatingTexts[i];
      ft.y -= 1;
      ft.alpha -= 0.015;
      if (ft.alpha <= 0) {
        floatingTexts.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = ft.alpha;
      ctx.font = 'bold 22px sans-serif';
      ctx.fillStyle = ft.color;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#000';
      ctx.shadowBlur = 4;
      ctx.fillText(ft.text, ft.x, ft.y);
      ctx.restore();
    }
  }

  drawBatter();

  animId = requestAnimationFrame(gameLoop);
}

function startGame() {
  // Safely stop any running animation frame to prevent freeze/speedup
  if (animId) {
    cancelAnimationFrame(animId);
    animId = null;
  }

  gameState = 'PLAYING';
  score = 0;
  hrs = 0;
  outs = 0;
  totalDist = 0;
  ball = null;
  particles = [];
  floatingTexts = [];
  pitchTimer = 30;
  isSwinging = false;

  updateHUD();
  startOverlay.classList.add('hidden');
  gameoverOverlay.classList.add('hidden');

  initAudio();
  gameLoop();
}

function endGame() {
  gameState = 'GAMEOVER';
  if (animId) {
    cancelAnimationFrame(animId);
    animId = null;
  }

  finalStats.textContent = `Total HRs: ${hrs} | Total Distance: ${totalDist} ft | Final Score: ${score}`;
  gameoverOverlay.classList.remove('hidden');
}

startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (gameState === 'PLAYING') {
      triggerSwing();
    } else if (gameState === 'START' || gameState === 'GAMEOVER') {
      startGame();
    }
  }
});

canvas.addEventListener('mousedown', (e) => {
  e.preventDefault();
  if (gameState === 'PLAYING') {
    triggerSwing();
  }
});

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (gameState === 'PLAYING') {
    triggerSwing();
  }
});
</script>
</body>
</html>
